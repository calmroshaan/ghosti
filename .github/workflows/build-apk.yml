name: Build Ghosti APK & Deploy Website

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Ghosti APK
        working-directory: ./ghosti-android
        run: gradle assembleDebug --no-daemon

      - name: Upload Ready-to-Install Ghosti APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghosti-Android-APK
          path: ghosti-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach Ghosti.apk to Download Website
        run: cp ghosti-android/app/build/outputs/apk/debug/app-debug.apk docs/Ghosti.apk

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Download Website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4